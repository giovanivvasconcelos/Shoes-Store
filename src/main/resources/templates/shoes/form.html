<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ShoeStore - Formulário</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

    <nav>
        <span>👟 ShoeStore</span>
        <div>
            <a th:href="@{/shoes}">Lista de Tênis</a>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit">Sair</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <h2 th:text="${shoe.id == null ? 'Novo Tênis' : 'Editar Tênis'}"></h2>

        <form th:action="@{/shoes}" th:object="${shoe}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label>Nome</label>
                <input type="text" th:field="*{name}" placeholder="Ex: Air Max" />
                <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="form-group">
                <label>Marca</label>
                <input type="text" th:field="*{brand}" placeholder="Ex: Nike" />
                <span class="error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
            </div>

            <div class="form-group">
                <label>Preço</label>
                <input type="number" step="0.01" th:field="*{price}" placeholder="Ex: 299.99" />
                <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
            </div>

            <div class="form-group">
                <label>Tamanho</label>
                <input type="number" th:field="*{size}" placeholder="Ex: 42" />
                <span class="error" th:if="${#fields.hasErrors('size')}" th:errors="*{size}"></span>
            </div>

            <div class="form-group">
                <label>Cor</label>
                <input type="text" th:field="*{color}" placeholder="Ex: Preto" />
                <span class="error" th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></span>
            </div>

            <button type="submit">Salvar</button>
            <a th:href="@{/shoes}">Cancelar</a>
        </form>
    </div>

</body>
</html>
